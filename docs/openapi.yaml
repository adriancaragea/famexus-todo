openapi: 3.1.0
info:
  title: Famexus Todo service
  version: 0.1.0
servers:
  - url: http://localhost:8001/api/v1
paths:
  /ping:
    get:
      summary: Liveness check for this service
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string, example: todo }
                  status: { type: string, example: ok }
